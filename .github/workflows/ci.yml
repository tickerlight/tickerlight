name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The software Vulkan driver and its loader: the pixel tests draw offscreen with them (the loader finds it).
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p tickerlight-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p tickerlight-strategy --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --workspace

  other-systems:
    strategy:
      fail-fast: false
      matrix:
        # GitHub's arm64 macOS runners were not to be had (its capacity): the Intel ones.
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tickerlight-app --bin tickerlight
      - run: cargo test --workspace
