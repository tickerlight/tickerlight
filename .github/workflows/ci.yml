name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The software Vulkan driver: the pixel tests draw offscreen with it.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p tickerlight-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p tickerlight-strategy --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json

  other-systems:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tickerlight-app --bin tickerlight
      - run: cargo test --workspace
