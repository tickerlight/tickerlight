name: Something is wrong
description: A crash, a wrong number, a picture that is off.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to get there
      placeholder: |
        1. BTCUSDT, Binance, 15m
        2. Replay from 9 Oct, Play
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and system
      description: What `tickerlight --version` prints (also at the end of the Look button's tooltip), and the system.
      placeholder: tickerlight 0.1.1, Windows 11 (or a commit, if built from source)
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error text, if any
      description: Started from a terminal on Linux or macOS, the program prints what went wrong there; on Windows a fatal error shows in a message box.
      render: text
