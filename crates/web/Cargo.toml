[package]
name = "tickerlight-web"
description = "The chart in a browser: WebAssembly build of the core with the wgpu backend."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tickerlight-core = { path = "../core" }
tickerlight-backend-wgpu = { path = "../backend-wgpu" }
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement"] }
