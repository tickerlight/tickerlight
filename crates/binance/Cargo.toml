[package]
name = "tickerlight-binance"
description = "Binance market data (klines, trades) as tickerlight-core data. A data source plugin: the core downloads nothing."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
tickerlight-core = { path = "../core" }
serde_json = "1.0.151"
sha2 = "0.11.1"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = "3.4.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tickerlight-backend-wgpu = { path = "../backend-wgpu" }
png = "0.18.1"
